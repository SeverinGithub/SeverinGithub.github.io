<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Countdown</title>
<style>
  :root { --bg: #ffffff; --fg: #37352f; --muted: #9b9a97; --box: #f7f6f3; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #191919; --fg: #ffffffcf; --muted: #7f7f7f; --box: #252525; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 16px; box-sizing: border-box; }
  #title { font-size: 15px; color: var(--muted); letter-spacing: .02em; }
  #title:empty { display: none; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .unit { background: var(--box); border-radius: 10px; min-width: 72px; padding: 14px 10px 10px; text-align: center; }
  .num { font-size: 36px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
  .lbl { font-size: 12px; color: var(--muted); margin-top: 6px; }
  #done { font-size: 28px; font-weight: 600; display: none; }
</style>
</head>
<body>
  <div id="title"></div>
  <div class="row" id="row">
    <div class="unit"><div class="num" id="d">0</div><div class="lbl">Tage</div></div>
    <div class="unit"><div class="num" id="h">0</div><div class="lbl">Stunden</div></div>
    <div class="unit"><div class="num" id="m">0</div><div class="lbl">Minuten</div></div>
    <div class="unit"><div class="num" id="s">0</div><div class="lbl">Sekunden</div></div>
  </div>
  <div id="done">🎉 Geschafft!</div>
<script>
  // Standard: 45 Tage ab 07.10.2026 → 21.11.2026, 00:00 Uhr.
  // Optional per Link änderbar: ?date=2026-12-24T18:00&title=Urlaub
  const p = new URLSearchParams(location.search);
  const target = new Date(p.get("date") || "2026-11-21T00:00:00");
  document.getElementById("title").textContent = p.get("title") || "";
  const pad = n => String(n).padStart(2, "0");
  function tick() {
    let t = Math.floor((target - Date.now()) / 1000);
    if (t <= 0) {
      document.getElementById("row").style.display = "none";
      document.getElementById("done").style.display = "block";
      return;
    }
    document.getElementById("d").textContent = Math.floor(t / 86400);
    document.getElementById("h").textContent = pad(Math.floor(t % 86400 / 3600));
    document.getElementById("m").textContent = pad(Math.floor(t % 3600 / 60));
    document.getElementById("s").textContent = pad(t % 60);
  }
  tick();
  setInterval(tick, 1000);
</script>
</body>
</html>

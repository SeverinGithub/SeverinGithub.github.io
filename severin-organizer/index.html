<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Organizer">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <title>Severin Organizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Symbole im Stil der SF Symbols -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-jobs" viewBox="0 0 24 24"><path fill="currentColor" d="M9 3.5h6A1.5 1.5 0 0 1 16.5 5v1.5H19A2.5 2.5 0 0 1 21.5 9v3.2a1 1 0 0 1-.7.95l-7.3 2.3a5 5 0 0 1-3 0l-7.3-2.3a1 1 0 0 1-.7-.95V9A2.5 2.5 0 0 1 5 6.5h2.5V5A1.5 1.5 0 0 1 9 3.5Zm.1 3h5.8V5.1H9.1ZM2.5 15.2l7.5 2.3a6.5 6.5 0 0 0 4 0l7.5-2.3V18a2.5 2.5 0 0 1-2.5 2.5H5A2.5 2.5 0 0 1 2.5 18Z"/></symbol>
      <symbol id="i-home" viewBox="0 0 24 24"><path fill="currentColor" d="M11.1 2.9a1.4 1.4 0 0 1 1.8 0l8.3 7a1 1 0 0 1-1.3 1.5l-.4-.3V19a2.5 2.5 0 0 1-2.5 2.5h-2.5v-5.5a1 1 0 0 0-1-1h-3a1 1 0 0 0-1 1v5.5H7A2.5 2.5 0 0 1 4.5 19v-7.9l-.4.3a1 1 0 0 1-1.3-1.5Z"/></symbol>
      <symbol id="i-todos" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5 5 8l2.8-3"/><path d="M3.5 13 5 14.5l2.8-3"/><circle cx="5.5" cy="19.2" r="1.7"/><path d="M11 6.5h9.5M11 13h9.5M11 19.2h9.5"/></g></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 4.5v15M4.5 12h15" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></symbol>
      <symbol id="i-chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6.5 6.5l-5 5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-left" viewBox="0 0 12 20"><path d="M10 2 2 10l8 8" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-right" viewBox="0 0 12 20"><path d="m2 2 8 8-8 8" stroke="currentColor" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></g></symbol>
      <symbol id="i-bank" viewBox="0 0 24 24"><path fill="currentColor" d="M11.3 2.7a1.5 1.5 0 0 1 1.4 0l8 4.2a1 1 0 0 1-.5 1.9H3.8a1 1 0 0 1-.5-1.9ZM5 10.3h2.5v7H5Zm5.75 0h2.5v7h-2.5Zm5.75 0H19v7h-2.5ZM3.5 18.5h17a1 1 0 0 1 0 2h-17a1 1 0 0 1 0-2Z"/></symbol>
      <symbol id="i-euro" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" d="M17.5 6.2A7 7 0 1 0 17.5 17.8M4 10h9M4 14h9"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7v5l3.2 2"/></g></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="m8.2 12.2 2.6 2.6 5-5.3"/></g></symbol>
      <symbol id="i-trend" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" d="m3.5 16.5 5.5-5.5 4 4 7.5-7.5M15 7.5h5.5V13"/></symbol>
      <symbol id="i-up" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 13v5.5A2 2 0 0 0 7 20.5h10a2 2 0 0 0 2-2V13"/></symbol>
      <symbol id="i-down" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 3.5V15M7.5 10.5 12 15l4.5-4.5M5 13v5.5A2 2 0 0 0 7 20.5h10a2 2 0 0 0 2-2V13"/></symbol>
      <symbol id="i-lock" viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.5A4.5 4.5 0 0 0 7.5 7v2.5H7A2.5 2.5 0 0 0 4.5 12v7A2.5 2.5 0 0 0 7 21.5h10a2.5 2.5 0 0 0 2.5-2.5v-7A2.5 2.5 0 0 0 17 9.5h-.5V7A4.5 4.5 0 0 0 12 2.5Zm-2.5 7V7a2.5 2.5 0 0 1 5 0v2.5Z"/></symbol>
      <symbol id="i-school" viewBox="0 0 24 24"><path fill="currentColor" d="M11.4 3.6a1.4 1.4 0 0 1 1.2 0l9 4.3a.8.8 0 0 1 0 1.4l-9 4.3a1.4 1.4 0 0 1-1.2 0L4 10.1V15a.9.9 0 0 1-1.8 0V9.3a.8.8 0 0 1 .3-.7ZM6.5 12.6l4.3 2.1a2.8 2.8 0 0 0 2.4 0l4.3-2.1V16c0 1.9-2.5 3.5-5.5 3.5S6.5 17.9 6.5 16Z"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></g></symbol>
      <symbol id="i-faceid" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8V6a3 3 0 0 1 3-3h2M16 3h2a3 3 0 0 1 3 3v2M21 16v2a3 3 0 0 1-3 3h-2M8 21H6a3 3 0 0 1-3-3v-2"/><path d="M8.5 9v1.5M15.5 9v1.5M12 9v4h-1M9 16.2a4.5 4.5 0 0 0 6 0"/></g></symbol>
    </defs>
  </svg>

  <div class="lock-screen" id="lock" hidden>
    <img src="icons/icon-180.png" alt="" class="lock-icon">
    <svg class="lock-face"><use href="#i-faceid"/></svg>
    <h2>Organizer ist gesperrt</h2>
    <button class="btn-fill lock-btn" data-action="unlock">Entsperren</button>
    <p class="lock-msg"></p>
  </div>

  <header class="navbar" data-page="jobs"><span class="t">Jobs</span><div class="right" id="nav-jobs"></div></header>
  <header class="navbar" data-page="school"><span class="t">Schule</span><div class="right" id="nav-school"></div></header>
  <header class="navbar" data-page="home"><span class="t">Übersicht</span><div class="right" id="nav-home"></div></header>
  <header class="navbar" data-page="todos"><span class="t">To-dos</span><div class="right" id="nav-todos"></div></header>

  <main id="app">
    <section class="page" id="page-jobs" data-page="jobs"></section>
    <section class="page" id="page-school" data-page="school"></section>
    <section class="page" id="page-home" data-page="home"></section>
    <section class="page" id="page-todos" data-page="todos"></section>
  </main>

  <nav class="tabbar" aria-label="Seiten">
    <button data-nav="jobs"><svg><use href="#i-jobs"/></svg><span>Jobs</span></button>
    <button data-nav="school"><svg><use href="#i-school"/></svg><span>Schule</span></button>
    <button data-nav="home"><svg><use href="#i-home"/></svg><span>Übersicht</span></button>
    <button data-nav="todos"><svg><use href="#i-todos"/></svg><span>To-dos</span></button>
  </nav>

  <div class="overlay" id="sheet-overlay" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="overlay" id="alert-overlay" hidden><div class="action-sheet" id="alert" role="alertdialog"></div></div>

  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
